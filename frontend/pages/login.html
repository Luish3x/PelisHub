<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PelisHub — Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

    <div class="bg"></div>
    <div class="sparks" id="sparks"></div>

    <div class="card">
        <div class="logo">PelisHub</div>
        <p class="tagline">Tu comunidad de reseñas</p>

        <div class="error-msg" id="errorMsg"></div>

        <div class="field">
            <label>Correo electrónico</label>
            <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn" id="loginBtn" onclick="handleLogin()">
            <span>Iniciar sesión</span>
            <div class="spinner"></div>
        </button>

        <p class="divider">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
    </div>

    <script src="/js/login.js"> </script>
</body>

</html>
