<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PelisHub — Película</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --red: #e50914;
            --red-dark: #b20710;
            --bg: #0a0a0a;
            --surface: #141414;
            --border: rgba(255, 255, 255, 0.07);
            --text: #f0f0f0;
            --muted: #777;
            --navbar-h: 64px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: var(--navbar-h);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 40px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), transparent);
            transition: background 0.3s;
        }

        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.9rem;
            letter-spacing: 2px;
            color: var(--red);
            text-decoration: none;
            text-shadow: 0 0 30px rgba(229, 9, 20, 0.35);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

        .nav-btn {
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 7px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: var(--red-dark);
        }

        .nav-btn.ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .nav-btn.ghost:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-username {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .nav-username span {
            color: var(--text);
            font-weight: 500;
        }

        /* BACKDROP */
        .backdrop {
            position: relative;
            margin-top: var(--navbar-h);
            height: 420px;
            overflow: hidden;
        }

        .backdrop-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(2px) brightness(0.3);
            transform: scale(1.05);
        }

        .backdrop-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10, 10, 10, 0.3) 0%, rgba(10, 10, 10, 1) 100%);
        }

        .backdrop-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a0a 0%, #0a0a0a 100%);
        }

        /* CONTENT */
        .content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px 80px;
            position: relative;
        }

        /* MOVIE HEADER */
        .movie-header {
            display: flex;
            gap: 36px;
            align-items: flex-start;
            margin-top: -180px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.5s 0.1s both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .movie-poster {
            width: 200px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border);
        }

        .movie-poster img {
            width: 100%;
            display: block;
        }

        .movie-poster-placeholder {
            width: 200px;
            aspect-ratio: 2/3;
            flex-shrink: 0;
            background: #1a1a1a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 1px solid var(--border);
        }

        .movie-info {
            flex: 1;
            padding-top: 120px;
        }

        .movie-genres {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .genre-tag {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(229, 9, 20, 0.4);
            color: rgba(229, 9, 20, 0.9);
        }

        .movie-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .movie-meta-sep {
            color: var(--border);
        }

        .movie-rating-imdb {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 197, 24, 0.1);
            border: 1px solid rgba(245, 197, 24, 0.2);
            border-radius: 4px;
            padding: 4px 10px;
        }

        .movie-rating-imdb .star {
            color: #f5c518;
            font-size: 1rem;
        }

        .movie-rating-imdb .score {
            color: #f5c518;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .movie-rating-imdb .label {
            color: var(--muted);
            font-size: 0.72rem;
        }

        .movie-plot {
            color: rgba(240, 240, 240, 0.75);
            font-size: 0.92rem;
            line-height: 1.7;
            max-width: 620px;
            margin-bottom: 20px;
            text-align: justify;
        }

        .movie-crew {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .crew-item {
            font-size: 0.82rem;
        }

        .crew-label {
            color: var(--muted);
            margin-bottom: 2px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .crew-value {
            color: var(--text);
            font-weight: 500;
        }

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 52px 0 28px;
        }

        .divider-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* FORM */
        .review-form {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 28px;
            margin-bottom: 40px;
        }

        .review-form h3 {
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .stars-wrap {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }

        .star-btn {
            font-size: 1.6rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #333;
            transition: color 0.15s, transform 0.15s;
            line-height: 1;
        }

        .star-btn:hover,
        .star-btn.active {
            color: #f5c518;
            transform: scale(1.15);
        }

        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            resize: vertical;
            min-height: 110px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: rgba(229, 9, 20, 0.4);
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .char-count {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .submit-btn {
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 10px 24px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: var(--red-dark);
        }

        .login-prompt {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 24px;
            text-align: center;
            margin-bottom: 40px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .login-prompt a {
            color: var(--red);
            text-decoration: none;
            font-weight: 500;
        }

        /* REVIEWS */
        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .review-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 22px;
            animation: fadeUp 0.4s both;
        }

        .review-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .review-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .review-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--red), #800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: #fff;
            flex-shrink: 0;
        }

        .review-author-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .review-date {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .review-stars {
            color: #f5c518;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .review-content {
            color: rgba(240, 240, 240, 0.8);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .review-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.78rem;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'DM Sans', sans-serif;
        }

        .reaction-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .reaction-btn.active {
            border-color: rgba(229, 9, 20, 0.4);
            color: var(--red);
            background: rgba(229, 9, 20, 0.07);
        }

        .review-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 3px;
            transition: color 0.15s, background 0.15s;
            font-family: 'DM Sans', sans-serif;
        }

        .action-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
        }

        .action-btn.danger:hover {
            color: #ff6b6b;
        }

        .no-reviews {
            text-align: center;
            padding: 48px 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .no-reviews span {
            display: block;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* FLASH */
        .flash {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: #1e1e1e;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 20px;
            font-size: 0.875rem;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .flash.show {
            transform: translateY(0);
            opacity: 1;
        }

        .flash.success {
            border-color: rgba(70, 211, 105, 0.4);
        }

        .flash.error {
            border-color: rgba(229, 9, 20, 0.4);
        }

        .hidden-badge {
            font-size: 0.75rem;
            color: #f5c518;
            background: rgba(245, 197, 24, 0.08);
            border: 1px solid rgba(245, 197, 24, 0.2);
            border-radius: 3px;
            padding: 5px 10px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .edit-area {
            margin-bottom: 16px;
        }

        .edit-textarea {
            width: 100%;
            min-height: 100px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(229, 9, 20, 0.3);
            border-radius: 4px;
            padding: 12px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            margin: 12px 0 10px;
        }

        .edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/" class="nav-logo">PelisHub</a>
        <div class="nav-right" id="navRight"></div>
    </nav>

    <div class="backdrop" id="backdrop">
        <div class="backdrop-placeholder"></div>
        <div class="backdrop-gradient"></div>
    </div>

    <div class="content">
        <div id="movieHeader" class="movie-header"></div>

        <div class="divider">
            <h2 class="divider-title">Reseñas</h2>
            <div class="divider-line"></div>
            <span id="reviewCount" style="color:var(--muted);font-size:0.8rem;white-space:nowrap"></span>
        </div>

        <div id="reviewFormWrap"></div>
        <div class="reviews-list" id="reviewsList"></div>
    </div>

    <div class="flash" id="flash"></div>

    <script>
        const API = 'http://localhost:3000/api';
        const params = new URLSearchParams(window.location.search);
        const imdbId = params.get('id');
        let currentUser = null;
        let selectedRating = 0;

        if (!imdbId) window.location.href = '/';

        function showFlash(msg, type = 'success') {
            const el = document.getElementById('flash');
            el.textContent = msg;
            el.className = 'flash ' + type + ' show';
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function starsHtml(n) {
            return '★'.repeat(n) + '☆'.repeat(5 - n);
        }

        function timeAgo(dateStr) {
            const diff = Date.now() - new Date(dateStr);
            const m = Math.floor(diff / 60000);
            if (m < 1) return 'ahora';
            if (m < 60) return 'hace ' + m + 'm';
            const h = Math.floor(m / 60);
            if (h < 24) return 'hace ' + h + 'h';
            return 'hace ' + Math.floor(h / 24) + 'd';
        }

        async function loadNav() {
            try {
                const res = await fetch(API + '/auth/me', {credentials: 'include'});
                if (res.ok) {
                    currentUser = await res.json();
                    document.getElementById('navRight').innerHTML =
                        '<a href="/pages/profile.html" style="text-decoration:none;color:inherit">' +
                        '<span class="nav-username">Hola, <span>' + user.username + '</span></span>' +
                        '</a>' +
                        '<button class="nav-btn ghost" onclick="logout()">Salir</button>';
                } else {
                    document.getElementById('navRight').innerHTML =
                        '<a href="/pages/login.html?redirect=' + encodeURIComponent(window.location.href) + '" class="nav-btn ghost">Iniciar sesión</a>' +
                        '<a href="/pages/register.html?redirect=' + encodeURIComponent(window.location.href) + '" class="nav-btn">Registrarse</a>';
                }
            } catch (e) { }
        }

        async function logout() {
            await fetch(API + '/auth/logout', {method: 'POST', credentials: 'include'});
            window.location.reload();
        }

        async function loadMovie() {
            try {
                const res = await fetch(API + '/movies/' + imdbId);
                const m = await res.json();
                document.title = 'PelisHub — ' + m.title;

                const posterUrl = m.poster_path
                    ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : null;

                if (posterUrl) {
                    document.getElementById('backdrop').innerHTML =
                        '<img class="backdrop-img" src="' + posterUrl + '" alt="' + m.title + '">' +
                        '<div class="backdrop-gradient"></div>';
                }

                const genres = m.genres
                    ? m.genres.map(g => '<span class="genre-tag">' + g.name + '</span>').join('') : '';

                const director = m.credits && m.credits.crew
                    ? m.credits.crew.find(p => p.job === 'Director') : null;

                const cast = m.credits && m.credits.cast
                    ? m.credits.cast.slice(0, 4).map(a => a.name).join(', ') : '';

                const ratingHtml = m.vote_average
                    ? '<div class="movie-rating-imdb"><span class="star">★</span><span class="score">' + m.vote_average.toFixed(1) + '</span><span class="label">TMDB</span></div>'
                    : '';

                const posterHtml = posterUrl
                    ? '<div class="movie-poster"><img src="' + posterUrl + '" alt="' + m.title + '"></div>'
                    : '<div class="movie-poster-placeholder">🎬</div>';

                const runtime = m.runtime ? m.runtime + ' min' : '—';
                const year = m.release_date ? m.release_date.substring(0, 4) : '—';

                document.getElementById('movieHeader').innerHTML =
                    posterHtml +
                    '<div class="movie-info">' +
                    '<div class="movie-genres">' + genres + '</div>' +
                    '<h1 class="movie-title">' + m.title + '</h1>' +
                    '<div class="movie-meta">' +
                    '<span>' + year + '</span>' +
                    '<span class="movie-meta-sep">·</span>' +
                    '<span>' + runtime + '</span>' +
                    ratingHtml +
                    '</div>' +
                    '<p class="movie-plot">' + (m.overview || '') + '</p>' +
                    '<div class="movie-crew">' +
                    (director ? '<div class="crew-item"><div class="crew-label">Director</div><div class="crew-value">' + director.name + '</div></div>' : '') +
                    (cast ? '<div class="crew-item"><div class="crew-label">Reparto</div><div class="crew-value">' + cast + '</div></div>' : '') +
                    '</div>' +
                    '</div>';
            } catch (e) {console.error(e);}
        }

        function renderForm() {
            const wrap = document.getElementById('reviewFormWrap');
            if (!currentUser) {
                wrap.innerHTML = '<div class="login-prompt"><a href="/pages/login.html?redirect=' + encodeURIComponent(window.location.href) + '">Inicia sesión</a> para dejar tu reseña</div>';
                return;
            }
            wrap.innerHTML =
                '<div class="review-form">' +
                '<h3>Tu reseña</h3>' +
                '<div class="stars-wrap">' +
                [1, 2, 3, 4, 5].map(n => '<button class="star-btn" data-n="' + n + '" onclick="setRating(' + n + ')">★</button>').join('') +
                '</div>' +
                '<textarea id="reviewText" placeholder="¿Qué te pareció?" maxlength="1000" oninput="document.getElementById(\'charCount\').textContent=this.value.length+\'/1000\'"></textarea>' +
                '<div class="form-footer">' +
                '<span class="char-count" id="charCount">0/1000</span>' +
                '<button class="submit-btn" onclick="submitReview()">Publicar reseña</button>' +
                '</div>' +
                '</div>';
        }

        function setRating(n) {
            selectedRating = n;
            document.querySelectorAll('.star-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.n) <= n);
            });
        }

        async function submitReview() {
            const content = document.getElementById('reviewText').value.trim();
            if (!selectedRating) {showFlash('Selecciona una calificación', 'error'); return;}
            if (!content) {showFlash('Escribe algo en tu reseña', 'error'); return;}
            try {
                const res = await fetch(API + '/reviews', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({imdb_id: imdbId, content, rating: selectedRating})
                });
                const data = await res.json();
                if (!res.ok) {showFlash(data.error, 'error'); return;}
                showFlash('Reseña publicada');
                document.getElementById('reviewText').value = '';
                selectedRating = 0;
                document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
                loadReviews();
            } catch (e) {showFlash('Error al publicar', 'error');}
        }

        async function loadReviews() {
            const list = document.getElementById('reviewsList');
            list.innerHTML = '';
            try {
                const res = await fetch(API + '/reviews/' + imdbId, {credentials: 'include'});
                const reviews = await res.json();

                document.getElementById('reviewCount').textContent =
                    reviews.length ? reviews.length + ' reseña' + (reviews.length !== 1 ? 's' : '') : '';

                if (!reviews.length) {
                    list.innerHTML = '<div class="no-reviews"><span>🎬</span>Sé el primero en reseñar esta película</div>';
                    return;
                }

                list.innerHTML = reviews.map(function (r, i) {
                    const reactions = ['👍 like', '👎 dislike', '💡 helpful', '😂 funny'].map(function (t) {
                        const parts = t.split(' ');
                        const emoji = parts[0], type = parts[1];
                        const count = r.reactions && r.reactions[type] ? r.reactions[type] : 0;
                        const active = r.userReaction === type ? 'active' : '';
                        return '<button class="reaction-btn ' + active + '" onclick="react(' + r.id + ',\'' + type + '\')">' + emoji + ' <span>' + count + '</span></button>';
                    }).join('');

                    const ownActions = currentUser && currentUser.id === r.user_id
                        ? '<div class="review-actions">' +
                        '<button class="action-btn" onclick="editReview(' + r.id + ',' + r.rating + ')">Editar</button>' +
                        '<button class="action-btn danger" onclick="deleteReview(' + r.id + ')">Eliminar</button>' +
                        '<button class="action-btn" onclick="toggleHide(' + r.id + ',' + r.is_hidden + ')">' + (r.is_hidden ? 'Mostrar' : 'Ocultar') + '</button>' +
                        '</div>'
                        : '';

                    return '<div class="review-card" style="animation-delay:' + (i * 0.05) + 's" id="review-' + r.id + '">' +
                        '<div class="review-header">' +
                        '<div class="review-author">' +
                        '<div class="review-avatar">' + r.username[0].toUpperCase() + '</div>' +
                        '<div><div class="review-author-name">' + r.username + '</div><div class="review-date">' + timeAgo(r.created_at) + '</div></div>' +
                        '</div>' +
                        '<div style="display:flex;align-items:center;gap:12px">' +
                        '<span class="review-stars">' + starsHtml(r.rating) + '</span>' +
                        ownActions +
                        '</div>' +
                        '</div>' +
                        (r.is_hidden ? '<div class="hidden-badge">🔒 Reseña oculta — solo tú la ves</div>' : '') +
                        '<p class="review-content">' + r.content + '</p>' +
                        '<div class="review-footer">' + reactions + '</div>' +
                        '</div>';
                }).join('');
            } catch (e) {console.error(e);}
        }

        async function react(reviewId, type) {
            if (!currentUser) {showFlash('Inicia sesión para reaccionar', 'error'); return;}
            try {
                await fetch(API + '/reviews/' + reviewId + '/react', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({type})
                });
                loadReviews();
            } catch (e) { }
        }

        async function deleteReview(id) {
            if (!confirm('¿Eliminar esta reseña?')) return;
            try {
                const res = await fetch(API + '/reviews/' + id, {method: 'DELETE', credentials: 'include'});
                if (res.ok) {showFlash('Reseña eliminada'); loadReviews();}
            } catch (e) { }
        }

        async function toggleHide(id, isHidden) {
            try {
                await fetch(API + '/reviews/' + id, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({is_hidden: !isHidden})
                });
                loadReviews();
            } catch (e) { }
        }

        async function init() {
            await loadNav();
            await loadMovie();
            renderForm();
            await loadReviews();
        }

        function editReview(id, currentRating) {
            const card = document.getElementById('review-' + id);
            const contentEl = card.querySelector('.review-content');
            const footerEl = card.querySelector('.review-footer');

            // Si ya está en modo edición, no hacer nada
            if (card.querySelector('.edit-area')) return;

            const originalText = contentEl.textContent.trim();

            // Reemplazar contenido con editor inline
            contentEl.style.display = 'none';
            footerEl.style.display = 'none';

            const editHtml =
                '<div class="edit-area">' +
                '<div class="stars-wrap" id="edit-stars-' + id + '">' +
                [1, 2, 3, 4, 5].map(n =>
                    '<button class="star-btn ' + (n <= currentRating ? 'active' : '') + '" ' +
                    'data-n="' + n + '" onclick="setEditRating(' + id + ',' + n + ')">★</button>'
                ).join('') +
                '</div>' +
                '<textarea class="edit-textarea" id="edit-text-' + id + '">' + originalText + '</textarea>' +
                '<div class="edit-actions">' +
                '<button class="action-btn" onclick="cancelEdit(' + id + ')">Cancelar</button>' +
                '<button class="submit-btn" style="padding:8px 18px;font-size:0.82rem" ' +
                'onclick="saveEdit(' + id + ')">Guardar</button>' +
                '</div>' +
                '</div>';

            contentEl.insertAdjacentHTML('afterend', editHtml);

            // Guardar rating actual en el área de edición
            card.querySelector('.edit-area').dataset.rating = currentRating;
        }

        function setEditRating(reviewId, n) {
            const area = document.getElementById('review-' + reviewId).querySelector('.edit-area');
            area.dataset.rating = n;
            area.querySelectorAll('.star-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.n) <= n);
            });
        }

        function cancelEdit(id) {
            const card = document.getElementById('review-' + id);
            card.querySelector('.edit-area').remove();
            card.querySelector('.review-content').style.display = '';
            card.querySelector('.review-footer').style.display = '';
        }

        async function saveEdit(id) {
            const card = document.getElementById('review-' + id);
            const content = document.getElementById('edit-text-' + id).value.trim();
            const rating = parseInt(card.querySelector('.edit-area').dataset.rating);

            if (!content) {showFlash('La reseña no puede estar vacía', 'error'); return;}
            if (!rating) {showFlash('Selecciona una calificación', 'error'); return;}

            try {
                const res = await fetch(API + '/reviews/' + id, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({content, rating})
                });
                const data = await res.json();
                if (!res.ok) {showFlash(data.error, 'error'); return;}
                showFlash('Reseña actualizada');
                loadReviews();
            } catch (e) {
                showFlash('Error al guardar', 'error');
            }
        }

        init();
    </script>
</body>

</html>
