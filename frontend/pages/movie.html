<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%230a0a0a'/><text x='50' y='68' font-family='Arial Black,sans-serif' font-size='48' font-weight='900' text-anchor='middle' fill='%23e50914'>PH</text></svg>">
    <title>PelisHub — Película</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/movie.css">
</head>

<body>

    <nav id="navbar">
        <a href="/" class="nav-logo">PelisHub</a>
        <div class="nav-links" id="navLinks"></div>
        <div class="nav-right" id="navRight"></div>
    </nav>

    <div class="backdrop" id="backdrop">
        <div class="backdrop-placeholder"></div>
        <div class="backdrop-gradient"></div>
    </div>

    <div class="content">
        <div id="movieHeader" class="movie-header"></div>

        <div class="divider">
            <h2 class="divider-title">Reseñas</h2>
            <div class="divider-line"></div>
            <span id="reviewCount" style="color:var(--muted);font-size:0.8rem;white-space:nowrap"></span>
        </div>

        <div id="reviewFormWrap"></div>
        <div class="reviews-list" id="reviewsList"></div>
    </div>

    <div class="flash" id="flash"></div>
    <script src="/js/nav.js"></script>
    <script src="/js/movie.js"></script>
</body>

</html>
