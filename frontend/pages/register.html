<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%230a0a0a'/><text x='50' y='68' font-family='Arial Black,sans-serif' font-size='48' font-weight='900' text-anchor='middle' fill='%23e50914'>PH</text></svg>">
    <title>PelisHub — Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

    <div class="bg"></div>
    <div class="sparks" id="sparks"></div>

    <div class="card">
        <div class="logo">PelisHub</div>
        <p class="tagline">Crea tu cuenta</p>

        <div class="error-msg" id="errorMsg"></div>

        <div class="field">
            <label>Nombre de usuario</label>
            <input type="text" id="username" placeholder="cinéfilo123" autocomplete="username">
        </div>
        <div class="field">
            <label>Correo electrónico</label>
            <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="new-password"
                oninput="checkStrength(this.value)">
            <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text" id="strengthText"></div>
        </div>

        <button class="btn" id="registerBtn" onclick="handleRegister()">
            <span>Crear cuenta</span>
            <div class="spinner"></div>
        </button>

        <p class="divider">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <script src="/js/register.js"></script>
</body>

</html>
