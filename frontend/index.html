<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PelisHub — Inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --red: #e50914;
            --red-dark: #b20710;
            --bg: #0a0a0a;
            --surface: rgba(18, 18, 18, 0.9);
            --card-bg: #141414;
            --border: rgba(255, 255, 255, 0.07);
            --text: #f0f0f0;
            --muted: #777;
            --navbar-h: 64px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: var(--navbar-h);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 40px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), transparent);
            transition: background 0.3s;
        }

        nav.scrolled {
            background: rgba(10, 10, 10, 0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.9rem;
            letter-spacing: 2px;
            color: var(--red);
            text-shadow: 0 0 30px rgba(229, 9, 20, 0.35);
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--muted);
            text-decoration: none;
        }

        .nav-username {
            color: var(--text);
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-user:hover .nav-username {
            color: var(--red);
        }

        .nav-btn {
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 7px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover {
            background: var(--red-dark);
        }

        .nav-btn.ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .nav-btn.ghost:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        /* HERO */
        .hero {
            position: relative;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(var(--navbar-h) + 60px) 40px 80px;
            overflow: hidden;
            text-align: center;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse 90% 70% at 50% 0%, rgba(229, 9, 20, 0.15) 0%, transparent 65%), radial-gradient(ellipse 60% 40% at 10% 80%, rgba(100, 0, 0, 0.12) 0%, transparent 60%);
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255, 255, 255, 0.012) 3px, rgba(255, 255, 255, 0.012) 4px);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 680px;
        }

        .hero-eyebrow {
            font-size: 0.72rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 14px;
            animation: fadeUp 0.6s 0.1s both;
        }

        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            line-height: 0.95;
            letter-spacing: 3px;
            margin-bottom: 18px;
            animation: fadeUp 0.6s 0.2s both;
        }

        .hero-title span {
            color: var(--red);
        }

        .hero-sub {
            color: var(--muted);
            font-size: 1rem;
            font-weight: 300;
            margin-bottom: 40px;
            animation: fadeUp 0.6s 0.3s both;
        }

        /* BUSCADOR */
        .search-wrap {
            width: 100%;
            max-width: 560px;
            animation: fadeUp 0.6s 0.4s both;
        }

        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 16px 20px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            backdrop-filter: blur(8px);
        }

        .search-input:focus {
            border-color: rgba(229, 9, 20, 0.5);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.1);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .search-clear {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 16px 18px;
            color: var(--muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            font-family: 'DM Sans', sans-serif;
            white-space: nowrap;
        }

        .search-clear.visible {
            display: block;
        }

        .search-clear:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SECCIÓN */
        .section {
            padding: 0 40px 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 28px;
        }

        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 1.5px;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--border), transparent);
        }

        .section-count {
            font-size: 0.78rem;
            color: var(--muted);
            white-space: nowrap;
        }

        /* GRID */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            transition: opacity 0.25s, transform 0.25s;
        }

        .movies-grid.fade-out {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }

        .movies-grid.fade-in {
            animation: gridIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes gridIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CARD */
        .movie-card {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            background: var(--card-bg);
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
            animation: cardIn 0.4s var(--delay, 0s) both;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .movie-card:hover {
            transform: scale(1.06) translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(229, 9, 20, 0.3);
            z-index: 2;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }

        .movie-poster-placeholder {
            width: 100%;
            aspect-ratio: 2/3;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 2rem;
        }

        .movie-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.2) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.25s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 14px;
        }

        .movie-card:hover .movie-overlay {
            opacity: 1;
        }

        .movie-overlay-title {
            font-size: 0.82rem;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .movie-overlay-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            color: var(--muted);
        }

        .movie-overlay-rating {
            color: #f5c518;
        }

        .movie-overlay-btn {
            margin-top: 10px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 2px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s;
        }

        .movie-overlay-btn:hover {
            background: var(--red-dark);
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #242424 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 4px;
            aspect-ratio: 2/3;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Sin resultados */
        .no-results {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 0;
            color: var(--muted);
        }

        .no-results span {
            display: block;
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .no-results strong {
            display: block;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            padding: 32px 40px;
            color: var(--muted);
            font-size: 0.78rem;
            border-top: 1px solid var(--border);
        }

        footer span {
            color: var(--red);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 3px;
            transition: color 0.2s, background 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>

    <nav id="navbar">
        <a href="/" class="nav-logo">PelisHub</a>
        <div class="nav-links">
            <a href="/" class="nav-link active">Inicio</a>
            <a href="/pages/about.html" class="nav-link">Nosotros</a>
            <a href="/pages/contact.html" class="nav-link">Contacto</a>
        </div>
        <div class="nav-right" id="navRight"></div>
    </nav>

    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <p class="hero-eyebrow">Tu comunidad de reseñas</p>
            <h1 class="hero-title">Descubre tu<br>próxima <span>película</span></h1>
            <p class="hero-sub">Lee reseñas reales, califica lo que viste, comparte tu opinión.</p>
            <div class="search-wrap">
                <div class="search-row">
                    <input type="text" class="search-input" id="searchInput" placeholder="Busca una película..."
                        autocomplete="off">
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕ Limpiar</button>
                </div>
            </div>
        </div>
    </section>

    <main class="section">
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">Populares ahora</h2>
            <div class="section-line"></div>
            <span class="section-count" id="sectionCount"></span>
        </div>
        <div class="movies-grid" id="moviesGrid">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
    </main>

    <footer>Hecho con <span>♥</span> · PelisHub © 2025</footer>

    <script>
        const API = 'http://localhost:3000/api';
        let searchTimeout;

        // ── Navbar ──
        async function loadNav() {
            try {
                const res = await fetch(API + '/auth/me', {credentials: 'include'});
                const navRight = document.getElementById('navRight');
                if (res.ok) {
                    const user = await res.json();
                    navRight.innerHTML =
                        '<a href="/pages/profile.html" class="nav-user">Hola, <span class="nav-username">' + user.username + '</span></a>' +
                        (user.role === 'admin' ? '<a href="/pages/admin.html" class="nav-btn ghost">Admin</a>' : '') +
                        '<button class="nav-btn ghost" onclick="logout()">Salir</button>';
                } else {
                    navRight.innerHTML =
                        '<a href="/pages/login.html" class="nav-btn ghost">Iniciar sesión</a>' +
                        '<a href="/pages/register.html" class="nav-btn">Registrarse</a>';
                }
            } catch (e) {
                document.getElementById('navRight').innerHTML =
                    '<a href="/pages/login.html" class="nav-btn ghost">Iniciar sesión</a>' +
                    '<a href="/pages/register.html" class="nav-btn">Registrarse</a>';
            }
        }

        async function logout() {
            await fetch(API + '/auth/logout', {method: 'POST', credentials: 'include'});
            window.location.reload();
        }

        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
        });

        // ── Render cards ──
        function renderMovies(movies) {
            const grid = document.getElementById('moviesGrid');
            grid.classList.remove('fade-out');
            grid.classList.add('fade-in');

            if (!movies.length) {
                grid.innerHTML = '<div class="no-results"><span>🔍</span><strong>Sin resultados</strong>Intenta con otro título</div>';
                return;
            }

            grid.innerHTML = movies.map(function (m, i) {
                const poster = m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : null;
                const year = m.release_date ? m.release_date.substring(0, 4) : '—';
                const rating = m.vote_average ? m.vote_average.toFixed(1) : '—';
                return '<a class="movie-card" href="/pages/movie.html?id=' + m.id + '" style="--delay:' + (i * 0.025) + 's">' +
                    (poster ? '<img class="movie-poster" src="' + poster + '" alt="' + m.title + '" loading="lazy">' : '<div class="movie-poster-placeholder">🎬</div>') +
                    '<div class="movie-overlay">' +
                    '<div class="movie-overlay-title">' + m.title + '</div>' +
                    '<div class="movie-overlay-meta"><span>' + year + '</span><span class="movie-overlay-rating">★ ' + rating + '</span></div>' +
                    '<button class="movie-overlay-btn">Ver reseñas</button>' +
                    '</div>' +
                    '</a>';
            }).join('');
        }

        // ── Populares ──
        async function loadPopular() {
            try {
                const res = await fetch(API + '/movies/popular');
                const movies = await res.json();
                document.getElementById('sectionTitle').textContent = 'Populares ahora';
                document.getElementById('sectionCount').textContent = movies.length + ' películas';
                renderMovies(movies);
            } catch (e) {
                document.getElementById('moviesGrid').innerHTML =
                    '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px">Error al cargar películas.</p>';
            }
        }

        // ── Búsqueda ──
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        searchInput.addEventListener('input', function () {
            clearTimeout(searchTimeout);
            const q = this.value.trim();

            if (!q) {clearSearch(); return;}

            searchClear.classList.add('visible');

            // Fade out
            const grid = document.getElementById('moviesGrid');
            grid.classList.add('fade-out');
            grid.classList.remove('fade-in');

            searchTimeout = setTimeout(() => doSearch(q), 400);
        });

        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') clearSearch();
        });

        async function doSearch(q) {
            document.getElementById('sectionTitle').textContent = 'Resultados para "' + q + '"';
            document.getElementById('sectionCount').textContent = 'Buscando...';
            document.querySelector('main').scrollIntoView({behavior: 'smooth', block: 'start'});

            try {
                const res = await fetch(API + '/movies/search?q=' + encodeURIComponent(q));
                const movies = await res.json();
                document.getElementById('sectionCount').textContent = movies.length + ' resultado' + (movies.length !== 1 ? 's' : '');
                renderMovies(movies);
            } catch (e) {
                document.getElementById('moviesGrid').innerHTML =
                    '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px">Error al buscar.</p>';
            }
        }

        function clearSearch() {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            const grid = document.getElementById('moviesGrid');
            grid.classList.add('fade-out');
            grid.classList.remove('fade-in');
            document.getElementById('sectionCount').textContent = '';
            setTimeout(() => loadPopular(), 200);
        }

        // ── Init ──
        loadNav();
        loadPopular();
    </script>
</body>

</html>
